# Poetry Platform — Dev Orchestration
#
# Architecture:
#   - `dev`       — ONE dev workstation container (opencode + all runtimes).
#                   Monorepo mounted at /workspace; app services run inside
#                   via `pnpm dev` (turbo). Ports for browser access only.
#   - `dev-v2`    - parallel OpenCode V2 workstation (ADR 11): same repo
#                   mount, working_dir rooted in the V2 worktree, isolated
#                   cache/state/pnpm volumes and disjoint host ports.
#   - `postgres`  — stateful infrastructure service. Data survives restarts
#                   (named volume `pgdata`). Reachable from dev as `postgres:5432`.
#
# OpenWebUI intentionally NOT here — each developer runs it locally in WSL Docker.
#
# Usage:
#   cp .env.example .env         # configure secrets/ports
#   docker compose up -d         # build dev image + start postgres
#   docker compose exec dev bash # shell into the workstation
#   docker compose exec dev pnpm dev   # start all app services (turbo)
#   docker compose down          # stop
#   docker compose down -v       # stop + wipe postgres data

# Explicit project name (DIA-121): compose otherwise derives the project from
# the compose file's directory. On the host the repo dir is 'poetry-platform',
# but inside the dev container it is mounted at /workspace, so the derived
# project becomes 'workspace' and container-status commands (used by the husky
# pre-commit/pre-push hooks) can no longer see the running containers. Pinning
# the name makes the file location-independent.
name: poetry-platform

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      # UID/GID alignment (DIA-260821-m7vk): forward host UID/GID into the image
      # so the `dev` user matches the host user and the bind-mounted .git/ is
      # writable. Fallback 1000 preserves the prior behavior for hosts on 1000.
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: poetry-platform-dev:latest
    container_name: poetry-dev
    hostname: poetry-dev
    # Author-studio (Quasar/Vite), api-server (FastAPI), publishing-platform (Nuxt)
    ports:
      - '${AUTHOR_STUDIO_PORT:-9000}:9000'
      - '${API_SERVER_PORT:-8000}:8000'
      - '${PUBLISHING_PORT:-3000}:3000'
    # Optional: expose postgres from host for psql tooling (disable if unwanted)
    # - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - .:/workspace:z
      # Named volume to keep pnpm store + node_modules inside container.
      # Host node_modules (if any) must not overwrite the container's.
      - pnpm_store:/workspace/node_modules
      - dev_state:/home/dev/.local/share
      - dev_cache:/home/dev/.cache
    # DEV-ONLY credentials (SEC-DOCKER-003): the `poetry` user/password
    # fallback is for local development only. Outside dev (CI, staging, prod)
    # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB MUST be set explicitly —
    # never rely on these defaults. There is intentionally no env validation
    # here: `make up` must keep working for fresh checkouts without a .env.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-poetry}:${POSTGRES_PASSWORD:-poetry}@postgres:5432/${POSTGRES_DB:-poetry}
      - OPENCODE_ENABLE_EXA=1
      # Secrets are NOT passed through env (SEC-DOCKER-002): the API keys live
      # in the read-only /run/secrets mounts below and are loaded by the
      # entrypoint (dev-entrypoint.sh). The /etc/profile.d/secrets.sh hook
      # (H5) re-loads them for `docker compose exec` login shells. Duplicating
      # them as env vars would leak them to `docker inspect` for no benefit.
    secrets:
      - anthropic_api_key
      - openai_api_key
      - context7_api_key
      - github_token
      - exa_api_key
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    # Match postgres: restart the dev workstation when the daemon/host reboots.
    restart: unless-stopped
    networks:
      - poetry-net

  # Parallel V2 workstation (ADR 11 decisions 2-3, design D1/D1a): OpenCode V2
  # runs side by side with the V1 `dev` service. Mounts the FULL repo - never a
  # single-directory worktree mount, which would hide /workspace/.git/objects
  # and break the worktree's .git pointer (D1a N1) - and roots the shell in the
  # V2 worktree so V2 resolves its project config there, never V1's (D1a N1).
  dev-v2:
    build:
      context: .
      dockerfile: Dockerfile.dev
      # UID/GID alignment as in `dev` (DIA-260821-m7vk): the bind-mounted
      # .git/ must stay writable by the container user.
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        # V2 OpenCode release pin - PLACEHOLDER only. The exact verified
        # release is decided by tasks.md 1.2's probe; 0.0.0 cannot install, so
        # a V2 build carrying the placeholder fails loudly instead of guessing.
        OPENCODE_VERSION: ${OPENCODE_VERSION_V2:-0.0.0}
    image: poetry-platform-dev-v2:latest
    container_name: poetry-dev-v2
    hostname: poetry-dev-v2
    working_dir: /workspace/.worktrees/opencode-v2
    # Same three services as `dev`: only the HOST side is disjoint (D1a N2).
    # Host ports are env-overridable, defaults 9100/8100/3100, never colliding
    # with V1's 9000/8000/3000. The container ports stay the applications'
    # listen ports (9000/8000/3000) - same as V1, since the apps inside
    # dev-v2 listen on the same container ports.
    ports:
      - '${AUTHOR_STUDIO_PORT_V2:-9100}:9000'
      - '${API_SERVER_PORT_V2:-8100}:8000'
      - '${PUBLISHING_PORT_V2:-3100}:3000'
    volumes:
      # Full repo mount (D1a N1) - git must see the real object store.
      - .:/workspace:z
      # Own pnpm store keyed to the V2 worktree: task 6.2's SDK swap must not
      # poison V1's store (D1a N2).
      - pnpm_store_v2:/workspace/.worktrees/opencode-v2/node_modules
      # Own state/cache (ADR 11 decision 3): V1 and V2 SQLite schemas and OMO
      # caches are incompatible; sharing them corrupts the V1 rollback point.
      - dev_v2_state:/home/dev/.local/share
      - dev_v2_cache:/home/dev/.cache
    # DEV-ONLY credentials (SEC-DOCKER-003): same `poetry` fallback pattern as
    # `dev`; API keys arrive via the read-only /run/secrets mounts below and
    # are loaded by dev-entrypoint.sh.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-poetry}:${POSTGRES_PASSWORD:-poetry}@postgres:5432/${POSTGRES_DB:-poetry}
      - OPENCODE_ENABLE_EXA=1
    secrets:
      - anthropic_api_key
      - openai_api_key
      - context7_api_key
      - github_token
      - exa_api_key
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - poetry-net

  postgres:
    image: postgres:16-alpine
    container_name: poetry-postgres
    restart: unless-stopped
    # DEV-ONLY credential defaults (SEC-DOCKER-003): weak `poetry` fallback is
    # acceptable for local development only. Any non-dev deployment must set
    # POSTGRES_PASSWORD explicitly; treat this default as an active risk marker.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poetry}
      POSTGRES_DB: ${POSTGRES_DB:-poetry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Optional: expose on host for external tooling (pgAdmin, psql from host)
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-poetry} -d ${POSTGRES_DB:-poetry}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - poetry-net

secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  openai_api_key:
    file: ./secrets/openai_api_key
  context7_api_key:
    file: ./secrets/context7_api_key
  github_token:
    file: ./secrets/github_token
  exa_api_key:
    file: ./secrets/exa_api_key

volumes:
  pgdata:
  pnpm_store:
  dev_state:
  dev_cache:
  # V2 service volumes (ADR 11 decision 3): disjoint from the V1 set above.
  pnpm_store_v2:
  dev_v2_state:
  dev_v2_cache:

networks:
  poetry-net:
    driver: bridge
