[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poetry-phonetics-core"
version = "0.1.0"
description = "Phonetic Atlas loader - cross-language FlatBuffers binary asset"
requires-python = ">=3.11"
dependencies = [
    "flatbuffers>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".git",
    "node_modules",
    ".opencode",
    "secrets",
    "scripts/generated",
    "scripts/generate_phonetic_atlas.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src", "scripts/generated/python"]
