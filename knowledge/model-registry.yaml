routing_table:
  - rung: "Rung0"
    signal: "Start / routine work"
    lane: "coder"
    model: "mimo-v2.5"
    quota_guarded: false
  - rung: "Rung1"
    signal: "Verify-fail #1 / Minor finding"
    lane: "coder"
    model: "mimo-v2.5"
    quota_guarded: false
  - rung: "Rung2"
    signal: "Verify-fail #2"
    lane: "coder"
    model: "qwen3.8-flash"  # Intentional divergence per DIA-260909-18f4 Variant A: Rung2 stays qwen3.8-flash (coder volume lane, cost); Terra is analysis-primary only.
    quota_guarded: false
  - rung: "Rung3"
    signal: "2x failed re-review loops OR Critical severity"
    lane: "coder-escalated"
    model: "openai/gpt-5.6-terra"  # DIA-260911-rqmw: Terra High paid escalation, one-shot no-retry (developer-gated, no auto-retry).
    quota_guarded: true
  - rung: "Rung3-fallback"
    signal: "Terra escalation failed AND developer approved fallback via wait_for_user (one-shot rule)"
    lane: "coder-escalated"
    model: "deepseek-v4-pro"
    quota_guarded: true
  - rung: "Rung3-fallback-2"
    signal: "deepseek-v4-pro quota exhausted or SILENT_FAILURE"
    lane: "coder-escalated"
    model: "mimo-v2.5-pro"
    quota_guarded: true
  - rung: "Rung4"
    signal: "Re-review after fixes"
    lane: "reviewer"
    model: "gpt-5.3-codex"
    quota_guarded: false
  - rung: "Analyzer"
    signal: "Default analysis"
    lane: "analyzer"
    model: "openai/gpt-5.6-terra"  # Aligned per DIA-260909-18f4 Variant A: matches muse-qwen-balanced analyzer primary (high).
    quota_guarded: false
  - rung: "Analyzer-escalated"
    signal: "cannot comprehend domain OR abort-on-complexity"
    lane: "analyzer-escalated"
    model: "gpt-5.6-luna"
    quota_guarded: true
  - rung: "Analyzer-route-back"
    signal: "After escalated pass"
    lane: "analyzer"
    model: "openai/gpt-5.6-terra"  # Aligned per DIA-260909-18f4 Variant A: matches muse-qwen-balanced analyzer primary (high).
    quota_guarded: false
