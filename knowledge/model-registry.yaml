  - model_id: "qwen3.7-plus"
    role: "arch/analyzer"
    price_in_1m: 0.40
    price_out_1m: 1.60
    req_per_month: 21600
    swe_bench_verified: 77.7
    source_ref: "res016"
    lane: "analyzer"
    fallback: []
    quota_notes: "Strong reasoning, 21.6K req/mo"
    active: true

  - model_id: "kimi-k3"
    role: "coder-escalated"
    price_in_1m: 3.00
    price_out_1m: 15.00
    req_per_month: 490
    swe_bench_verified: 93.40
    source_ref: "res016"
    lane: "coder-escalated"
    fallback: ["deepseek-v4-pro", "mimo-v2.5-pro"]
    quota_notes: "Binding cap 490 req/mo"
    active: true

  - model_id: "gpt-5.6-luna"
    role: "analyzer-escalated"
    price_in_1m: 0.20
    price_out_1m: 1.20
    req_per_month: 10250
    swe_bench_verified: null
    source_ref: "res016"
    lane: "analyzer-escalated"
    fallback: []
    quota_notes: "Subagent-weak caveat"
    active: true

  - model_id: "deepseek-v4-pro"
    role: "fallback"
    price_in_1m: 0.435
    price_out_1m: 0.87
    req_per_month: 17150
    swe_bench_verified: 74.0
    source_ref: "res017"
    lane: "coder-escalated"
    fallback: []
    quota_notes: "Independent CAISI evidence"
