# COST ANALYSIS (DIA-261022-6vcz, 2026-10-22): why opencode-go/gemini-4-argon-contributor
# beats opencode-go/grok-4.7 on a Go subscription despite a 3.3x more expensive output
# price. All figures DEVELOPER-SUPPLIED 2026-10-22, quoted from the official OpenCode Go
# billing table https://opencode.ai/v2/docs/console/go/ - NOT gate-verified; where they
# conflict with an earlier registry figure, both are recorded with their assumptions.
#
# Agentic OpenCode sessions are cache-read dominated: the representative request profile
# is 410 NEW input tokens + 71,300 CACHED tokens + 310 output tokens (~98% of input
# traffic is cache reads). The cache-read price, not the output price, therefore drives
# cost per request:
#   - grok-4.7 at $0.50 per 1M cache: 71,300 cached tokens cost ~$0.0356, plus small
#     new-input and output terms, ~$0.0383 per request. Against the $3.00 per-5h slice
#     that is ~78 requests; against the $15.00 monthly pool, ~390 requests.
#   - gemini-4-argon-contributor at $0.20 per 1M cache: the same 71,300 cached tokens
#     cost ~$0.0142, ~$0.022-0.027 per request. Against the $12.00 per-5h slice that is
#     ~440 requests; against the $60.00 promo pool, ~2,200 requests.
# CONCLUSION: on the Go subscription Argon gives roughly 5.5x the request headroom of
# grok-4.7, and still roughly 3x after the 2x promo ends and the pool reverts to $30.00.
# The single scenario where grok-4.7 wins: closed-source work under NDA where Zero Data
# Retention is mandatory - the Contributor tier of Gemini 4 Argon is NOT ZDR (it trains
# on prompts and completions). This is exactly the trade already accepted in the header
# waiver for the architector and ai-auditor lanes (see privacy_notes on the gemini entry).

  - model_id: "opencode-go/gemini-4-argon-contributor"
    role: "multi-lane-primary (architector + ai-auditor, Not-ZDR waiver)"
    price_in_1m: 4.00  # Go plan price (direct-API list price is 2.00); DEVELOPER-SUPPLIED 2026-10-22, not gate-verified
    price_out_1m: 20.00  # Go plan price (direct-API list price is 10.00); DEVELOPER-SUPPLIED 2026-10-22, not gate-verified
    req_per_month: 2200  # ESTIMATE under 2x promo; DEVELOPER-SUPPLIED 2026-10-22, not gate-verified
    swe_bench_verified: null
    source_ref: "DIA-261022-6vcz probe 2026-10-22 (live Go catalog listed + dispatch probe PASS 'OK'); economics DEVELOPER-SUPPLIED 2026-10-22"
    lane: ["architector", "ai-auditor"]  # DIA-261022-6vcz 2026-10-22: architector moved here from opencode-go/grok-4.7 (variant high = max rung); ai-auditor added round 2 (variant medium).
    fallback: ["opencode-go/longcat-2.0", "opencode-go/minimax-m3"]
    quota_notes: "DEVELOPER-SUPPLIED 2026-10-22, quoted from official OpenCode Go billing table https://opencode.ai/v2/docs/console/go/ - NOT gate-verified (every economic figure in this note is developer-supplied on that date from that URL; where they conflict with any earlier figure, both are recorded with their assumptions rather than overwritten). Go plan price $4.00/$20.00 per 1M (direct-API list price is $2.00/$10.00 - Go plan is 2x list). Cached read: $0.20 per 1M (no dedicated cache field in this registry). Allowance: monthly pool $60.00 under the current 2x promo, $30.00 base; 5h slice $12.00 ($6.00 base). Throughput: ~440 req/5h under promo (~220 without), ~2,200 req/mo under promo. Cache-read economics vs opencode-go/grok-4.7: see cost-analysis comment block between the grok-4.7 and gemini entries."
    privacy_notes: "NOT-ZDR: Gemini 4 Argon Contributor (Contributor tier) trains on prompts/completions; developer-cleared 2026-10-22 under DIA-261022-6vcz on the no-sensitive-traffic basis, mirroring the DIA-260828-qtsi Muse precedent. The single waiver covers BOTH lanes on this model - architector and ai-auditor - so every architector and ai-auditor dispatch is non-ZDR traffic. Any lane on a trains-on-data model requires such an explicit registry waiver, never a silent exception."
    active: true

