# DIA-133 dispatch routing registry (ADR-DIA-133, approved 2026-08-13). Evidence: res013/016/017 (source_ref per score). No self-benchmark figures (ana014). Registry owner: ai-specialist research -> coder edit (developer decision 2026-08-13).
schema_version: "1.0"
models:
  - model_id: "deepseek-v4-flash"
    role: "coder-default"
    price_in_1m: 0.14
    price_out_1m: 0.28
    req_per_month: 158150
    swe_bench_verified: 73.7
    source_ref: "res013"
    lane: "coder"
    fallback: []
    quota_notes: "Volume default, 158K req/mo headroom"
