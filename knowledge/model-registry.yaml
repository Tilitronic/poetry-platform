routing_table:
  - rung: "Rung0"
    signal: "Start / routine work"
    lane: "coder"
    model: "mimo-v2.5"
    quota_guarded: false
  - rung: "Rung1"
    signal: "Verify-fail #1 / Minor finding"
    lane: "coder"
    model: "mimo-v2.5"
    quota_guarded: false
  - rung: "Rung2"
    signal: "Verify-fail #2"
    lane: "coder"
    model: "qwen3.7-plus"
    quota_guarded: false
  - rung: "Rung3"
    signal: "2x failed re-review loops OR Critical severity"
    lane: "coder-escalated"
    model: "kimi-k3"
    quota_guarded: true
  - rung: "Rung3-fallback"
    signal: "kimi-k3 quota exhausted or SILENT_FAILURE"
    lane: "coder-escalated"
    model: "deepseek-v4-pro"
    quota_guarded: true
  - rung: "Rung3-fallback-2"
    signal: "deepseek-v4-pro quota exhausted or SILENT_FAILURE"
    lane: "coder-escalated"
    model: "mimo-v2.5-pro"
    quota_guarded: true
  - rung: "Rung4"
    signal: "Re-review after fixes"
    lane: "reviewer"
    model: "gpt-5.3-codex"
    quota_guarded: false
  - rung: "Analyzer"
    signal: "Default analysis"
    lane: "analyzer"
    model: "qwen3.7-plus"
    quota_guarded: false
  - rung: "Analyzer-escalated"
    signal: "cannot comprehend domain OR abort-on-complexity"
    lane: "analyzer-escalated"
    model: "gpt-5.6-luna"
    quota_guarded: true
  - rung: "Analyzer-route-back"
    signal: "After escalated pass"
    lane: "analyzer"
    model: "qwen3.7-plus"
    quota_guarded: false
