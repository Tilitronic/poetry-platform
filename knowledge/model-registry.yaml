  - model_id: "gpt-5.3-codex"
    role: "reviewer"
    price_in_1m: 1.75
    price_out_1m: 14.00
    req_per_month: null
    swe_bench_verified: 85.0
    source_ref: "res013"
    lane: "reviewer"
    fallback: []
    quota_notes: "Copilot credits - skip guard"
