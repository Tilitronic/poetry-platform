  - model_id: "mimo-v2.5-pro"
    role: "fallback-2"
    price_in_1m: 0.435
    price_out_1m: 0.87
    req_per_month: 16300
    swe_bench_verified: null
    source_ref: "res017"
    lane: "coder-escalated"
    fallback: []
    quota_notes: "Vendor-only benchmark; benchmark-gap OPEN"
