    description: 'Conspect synthesizing OpenCode Go pricing and usage limits (18 models, $5 first month then $10/mo, $12/5h, $30/wk, $60/mo caps), GitHub Copilot per-1M-token pricing and AI-credit plan allowances, SWE-bench Verified scores from BenchLM/Vals/official trackers, variant/mode notes, and key findings (Kimi K3 93.4% best Go model at 490 req/mo; Grok 4.5 86.6% at 600 req/mo; GPT 5.6 Luna cheap lightweight; DeepSeek V4 Flash volume king 158K req/mo at $0.14/$0.28; MiniMax M3 80.5%). Records the DIA-108 developer disposition: Claude Sonnet 5 recommendation REJECTED because that model is not in the actual Copilot Pro subscription model list - pricing-page availability does not imply subscription availability.'
    path: knowledge/res013-opencode-model-pricing-audit/res013-opencode-model-pricing-audit-conspect.md
    created: 2026-08-12
  - name: Model Escalation Routing for Coder and Analyzer Agents (DIA-111)
    description: 'Conspect synthesizing escalation/model-routing approaches for agentic coding workflows (8 archived sources): 6 routing patterns (LLM-classifier, stage router, escalation router from NVIDIA NeMo Switchyard; reflect/replan/escalate recovery routing from CodeRescue/ARCHER with Conformal Risk Control; trajectory-conditioned temporal routing from SWE-Router; C-A-F loop with memory from Agent-as-a-Router/ACRouter) plus supporting patterns (codified effort+escalation policy from AgentPatterns, production reliability failure taxonomy from Tanay Shah, unified (agent,tier) escalation ladder from nax ADR-025). Includes the coder escalation ladder Rung0-4 design (deepseek-v4-flash default -> recovery -> qwen3.7-plus -> deepseek-v4-pro OR mimo-v2.5-pro -> re-review), the analyzer-to-GPT-5.6-Luna escalation design with routing back to qwen3.7-plus, and the MiMo-V2.5-Pro vs DeepSeek-V4-Pro comparison (identical $0.435/$0.87 Go pricing and ~16-17K req/mo; DeepSeek V4 Pro has archived SWE-bench scores 73.6-80.6%, MiMo-V2.5-Pro has a benchmark gap tracked by DIA-087 R5). Benchmarks/pricing cross-referenced from res013 (no duplication).'
    path: knowledge/res014-model-escalation-routing/res014-model-escalation-routing-conspect.md
    created: 2026-08-12
  - name: MiMo-V2.5-Pro Agentic Coding Evaluation (DIA-114)
    description: 'Conspect closing the DIA-087 R5 MiMo benchmark gap (32 archived sources): MiMo-V2.5-Pro identity/lineage (1.02T/42B sparse MoE, hybrid SWA+GA 6:1, 3-layer MTP, 1M context, FP8, MIT, May 2025 cutoff, released 2026-04-22; V2 series deprecated 2026-06-30; MiMo Code = Xiaomi OpenCode fork). Benchmark table with per-score attribution: SWE-bench Verified 78.9%, SWE-bench Pro 57.2%, Terminal-Bench 2.0 68.4%, ClawEval 63.8% (~70K tokens/traj, 40-60% fewer than Opus 4.6/Gemini 3.1 Pro/GPT-5.4), GDPVal-AA Elo 1581, MiMo Coding Bench 73.7%, tau3-bench 72.9%, GPQA-Diamond 86.6/66.7, HLE 33.8-48.0; NO OSWorld score found. All headline scores vendor-reported (Xiaomi), not independently reproduced. Agentic integration: OpenAI-compatible tool_calls (OpenHands/SWE-agent/Cline/Aider), OpenCode handles reasoning_content correctly while Cursor/Roo/Codex/Copilot CLI/TRAE fail (DataCamp, Medium confidence); MiMo Code harness gain ~5pts self-reported. OpenCode/Go first-class: mimo-v2.5-pro at $0.435/$0.87, 16,300 req/mo, endpoint opencode.ai/zen/go/v1/chat/completions; Xiaomi official OpenCode doc; community configs (gajae-code critic role, fmflurry conductor, OmniRoute mimo-pro, CodeWhale, lobehub, gpt4free). Rung-3 verdict (DIA-111/res014): mimo-v2.5-pro recommended default (edges on Terminal-Bench/SWE-Pro/GDPVal + token efficiency + OpenCode-native), deepseek-v4-pro retains reasoning edge (GPQA 90.1, SWE Verified 80.6); both headline SWE numbers vendor-reported, live in-repo benchmark recommended before finalizing. Cross-references res013 (pricing) and res014 (escalation ladder).'
    path: knowledge/res015-mimo-v25-pro-evaluation/res015-mimo-v25-pro-evaluation-conspect.md
    created: 2026-08-12
  - name: Coder-Escalated Model Evidence (DIA-111)
    description: 'Conspect synthesizing Session 15 (DIA-111) evidence for the coder-escalated model lane (25 fresh archived sources + 5 cross-refs to res013/014/015): comparison of kimi-k3 / gpt-5.6-luna / qwen3.7-max / qwen3.7-plus / deepseek-v4-pro on SWE-bench Verified, Terminal-Bench, SWE-bench Pro, AA Coding Agent Index, Go pricing and req/mo. Kimi K3 (released 2026-07-16): 2.8T MoE 16/896 experts, 1M ctx, open weights; Vals independent SWE-bench Verified 93.40% (best open-weight, ahead of Opus 4.8 88.6/Grok 4.5 86.6); TB2.1 88.3 vendor/85 AA-independent; AA Intelligence 57 (4th overall, 1st open-weight); LMArena Frontend #1; 490 req/mo at $3/$15 on Go (binding cap). GPT-5.6 Luna: nano-tier, 1M ctx, full tool use, reasoning to max; AA Coding Agent Index 74.6 (OpenAI)/75 (AA); TB2.1 84.7; SWE-Pro 62.7; Vals split 96/92/86/67; Intelligence Index 51 at $0.21/task (Pareto frontier); 80% price cut 2026-07-30 to $0.20/$1.20; official "well-specified changes" lane (plan with Sol, implement with Luna); SUBAGENT-WEAK (Codex native subagent rejects it, v1 catalog filter, top-level-thread deployment; BenchLM Agentic #35 of 129). Qwen3.7-Max (closed text-only, SWE-V 80.4 vendor, TB2.0 69.7, $2.50/$7.50, 1,690 req/mo) and Qwen3.7-Plus (closed multimodal, SWE-V 77.7 BenchLM, Agentic #107 of 129 weak, $0.40/$1.60, 21,600 req/mo) NOT recommended as escalation tier. Corrections: C1 qwen3.7-pro does not exist (real names qwen3.7-max/plus, 4 sources); C2 luna agentic-capable but subagent-weak (orcarouter + BenchLM). VERDICT: kimi-k3 recommended for coder-escalated with cap-fallback to deepseek-v4-pro/mimo-v2.5-pro; luna for analyzer-escalated with subagent-weakness caveat. Cross-references res013 (Go pricing), res014 (Rung0-4 ladder), res015 (mimo-vs-deepseek).'
    path: knowledge/res016-coder-escalated-model-evidence/res016-coder-escalated-model-evidence-conspect.md
    created: 2026-08-12
  - name: Rung-3 Coder-Escalation Benchmark Evidence (DIA-116)
    description: 'Conspect closing the DIA-116 evidence gap with authoritative third-party benchmark evidence for the three Rung-3 coder-escalation candidates (21 fresh archived sources + 1 documented failure; cross-refs res013/014/015/016, ana014). Key independent reproductions: kimi-k3 SWE-bench Verified 93.40% (Vals AI mini-swe-agent bash-only harness, leaderboard updated 2026-08-08 - the DIA-114-flagged missing reproduction, strongest open-weight model); deepseek-v4-pro SWE-bench Verified 74% (NIST CAISI, U.S. government, Inspect ReAct, 2026-05-01, IRT Elo 800, "lags frontier ~8 months", vendor 80.6% flagged Unverified on evals.report); mimo-v2.5-pro has NO independent coding-benchmark reproduction (78.9% headline vendor-only, Xiaomi card/mimo.xiaomi.com; only independent datum is AA Intelligence Index composite 43). AA Intelligence Index: kimi-k3 57.11-60 vs deepseek-v4-pro 45 vs mimo 43. Terminal-Bench 2.1: kimi-k3 88.3 vendor (Kimi Code) / 85.0 AA (Terminus 2, II v4.1.1 component) / 80.9 Vals-harness; deepseek-v4-pro 72.1 (Vals leaderboard, preview row); mimo 57.3 (Vals). VERDICT: keep kimi-k3 coder-escalated default (only candidate with independent headline-benchmark reproduction; 490 req/mo cap at $3/$15 binding); Rung-3 fallback prefer deepseek-v4-pro over mimo-v2.5-pro (REVERSES DIA-114 provisional MiMo pick - deepseek has CAISI independent evidence, mimo has none, both $0.435/$0.87); cap note kimi-k3 ~13x pricier per token (~$2.31/M AA blended vs $0.18/M co-candidates). Correction C1: DIA-114 evidence gap RESOLVED (kimi-k3), PARTIAL (deepseek), OPEN (mimo); evidence basis is authoritative sources (no self-benchmarking per developer directive 2026-08-12; ana014 in-repo protocol cancelled). 1 unarchived source (llm-stats.com, anti-bot wall; TB 2.1 covered by benchmarklist/AA archives).'
    path: knowledge/res017-rung3-benchmark-evidence/res017-rung3-benchmark-evidence-conspect.md
    created: 2026-08-12
  - name: OpenCode Agent Presets (models/temperature/reasoning effort) for Go + Copilot workflow
    description: 'Conspect synthesizing optimal agent presets for the OpenCode Go + Copilot workflow from 19 archived sources: DeepSeek V4 Flash specs (284B/13B MoE, 1M ctx, 384K out, Non-think/High/Max modes, reasoning_effort low/high/xhigh/max -> low/high/high/max on Flash, temp inert in thinking mode, temp=0.0 for deterministic coding, agentic scores Terminal Bench 2.1 82.7 / DeepSWE 54.4 / Toolathlon 70.3); GPT 5.6 Luna (nano tier, 1M ctx, 128K out, reasoning.effort none..max, Coding Agent Index 74.6, $0.2/$1.2); Go 2x-usage promo tags (Flash $0.07/$0.14, Luna $0.10/$0.60 per tracker), request budgets (Flash 31,650/5h and 158,150/mo at $60 tier; Luna 2,050/5h and 10,250/mo at $15 tier), $12/5h $30/wk $60/mo caps, config id opencode-go/<model-id>; Copilot credit billing (1 credit = $0.01, Pro 1,500/mo), Copilot-only models (GPT-5.3-Codex, Sol/Terra, Claude Sonnet 4.x, Gemini 3.1 Pro; Grok 4.5 IS on Go - brief corrected), CLI BYOK + ACP; per-role temperature bands (code 0.0-0.3, review 0.0-0.2, architecture 0.2-0.4, spec 0.1-0.3, research 0.5-0.7); reasoning effort (medium beats high on code, high for architecture/debug/security); recommended preset delta (coder += Luna secondary, designer += Luna fallback, reviewer reasoningEffort=medium, temps unchanged) - RECOMMENDATION NOT APPLIED (developer declined 2026-08-12). Fills the temperature/reasoning gap vs res013 (pricing only).'
    path: knowledge/res021-opencode-agent-presets/res021-opencode-agent-presets-conspect.md
    created: 2026-08-12
  - name: Ticket Management Automation (DIA-125)
    description: 'Conspect for DIA-125 (OPEN research ticket): evaluate ready-made local
      solutions (MCP/self-hosted) vs manual ledger for ticket creation and management
      (22 archived sources). Candidate table across 16 candidates (github-mcp-server,
      Linear MCP, plane-mcp-server, Plane, Vikunja, Focalboard, OpenProject, Redmine,
      Taiga, Leantime, git-bug, steviee/git-issues, timonburkard/git-issue, dspinellis/git-issue,
      OpenSpec tasks.md, opencode-ework). MCP maturity assessment: write-capable servers
      exist for github/linear/plane/vikunja; local-first ones are linear-local-mcp
      (read-only, macOS), linear-cache-mcp (Linear-bound), and self-hosted vikunja/plane
      stdio servers; NO file/git-backed MCP exists - the gap a thin local writer fills.
      Hybrid recommendation: keep git-backed markdown ledger; Tier 1 codify manual writer
      (DIA-NNN+slug, frontmatter v2, README index, archive/); Tier 2 steviee/git-issues
      experiment (structural twin: .issues/ markdown + YAML frontmatter, JSON agent
      commands, worktree rules); Tier 3 Plane/Vikunja self-host at scale. Rejections:
      Focalboard unmaintained, OpenProject heavy/no MCP, cloud-only GitHub/Linear violate
      local-first (ana006). Taiga, dspinellis/git-issue, opencode-ework excluded per
      DIA-072 (no archived sources).'
    path: knowledge/res018-ticket-management-automation/res018-ticket-management-automation-conspect.md
    created: 2026-08-13
  - name: OMO Slim 2.2.13 Version-Gate Research (DIA-127)
    description: 'Conspect persisting the DIA-127 version-gate research for the oh-my-opencode-slim
      2.2.8 -> 2.2.13 plugin upgrade (10 archived sources + 2 documented NOT-ARCHIVED npmjs
      SPA pages, DIA-072 exclusions). Release timeline: v2.2.11 is the substantive release
      in the window (20 merged items; opencode2 dual-compat PR #979 - one package runs on
      OpenCode v1 and v2 via {id, server, setup} default export + src/v2/ adapter, build:v2
      dist/server.js via ./server subpath, 1697 tests, known v2 limitations: no per-prompt
      model override / no session model-setter, v2 TUI default agent build not orchestrator,
      no programmatic MCP registration); v2.2.9 removed the plugin websearch MCP (PR #936,
      Exa/Tavily; built-in websearch via OPENCODE_ENABLE_EXA / OPENCODE_ENABLE_PARALLEL;
      websearch permission key retained); v2.2.12 (10 Aug 21:58) and v2.2.13 (11 Aug 20:08)
      are tag-only releases (no release notes, npm publish at tag time); compare v2.2.8...v2.2.13
      shows 23 contributors (261 commits / 220 files NOT in archive - page render failure,
      excluded per DIA-072); npm registry dist-tags.latest = 2.2.13 published 2026-08-11
      (~2 days before the DIA-127 research date 2026-08-13); package.json v2.2.13 exact-pins
      @opencode-ai/plugin 1.18.13 and @opencode-ai/sdk 1.18.13. Breaking-change signals
      for the project config (3 presets opencode-go/cebula/free, DIA-126 conspecter hardening,
      agent-name lockstep, dual runtime vendored + npm) audited in section 7. DIA-126 re-verify
      PASS: all 12 curl/trafilatura archival commands ran without a single permission ask;
      crwl chromium failure (DIA-129) expected and documented; webfetch never needed.'
    path: knowledge/res019-omo-slim-version-gate/res019-omo-slim-version-gate-conspect.md
    created: 2026-08-13
  - name: OpenCode Agent Config Watchdog Research (DIA-132)
    description: 'Conspect for DIA-132 (coder-escalated kimi-k3 ONE-SHOT silent failure on DIA-130): persist the ai-specialist hardening research on timeout/heartbeat/empty-result-detection mechanisms (3 archived sources, zero failures - live opencode.ai/config.json AgentConfig schema via raw curl, Agents + Plugins docs pages via trafilatura). AgentConfig surface: model, variant, temperature, top_p, prompt, tools (deprecated->permission), disable, description, mode (subagent/primary/all), hidden, options (provider pass-through), color, steps, maxSteps (deprecated->steps), permission (16 keys incl. doom_loop). "steps" = maximum agentic ITERATIONS before forcing text-only response (positive integer, NOT a wall-clock timeout; docs: on limit the agent receives a system prompt to summarize work + remaining tasks). Plugin API: session events (created/compacted/deleted/diff/error/idle/status/updated), tool.execute.before/after, experimental.session.compacting (fires before continuation-summary generation; output.prompt replaces the compaction prompt) - mapped to delegation-observer.ts usage (A1 pure-dispatch, A2 task_id capture, event-based lifecycle RUNNING/COMPLETE/FAILED + S1 A3 silent-failure scan, compaction snapshot injection). Absence findings: NO native per-agent timeout (only ProviderConfig options.timeout/headerTimeout/chunkTimeout and MCP server timeouts in the schema) and NO native empty-result handling (no AgentConfig field, no plugin event) in OpenCode v1.18.12 era - plugin-side session-event monitoring is the available native path for the ticket''s hardening candidates. ID corrected from res003 to res020 (res001..res019 already registered).'
    path: knowledge/res020-opencode-agent-config-watchdog/res020-opencode-agent-config-watchdog-conspect.md
    created: 2026-08-13
  - name: Ticket Automation Landscape Evaluation (DIA-125 follow-on)
    description: 'Conspect for DIA-125 follow-on (res-1): ticket-automation landscape
      evaluation (13 archived sources, zero failures). Grounds the delegation-observer
      ticket-gate mechanics in plugin source (scanTickets reads docs/dev-infra-audit/tickets/,
      filename regex /^DIA-(\d+)/, dispatch regex /DIA-\d+/gi format-agnostic, strict
      tri-state DIA-076 C1, ticket-creation + checksum exemptions, fail-soft on scan
      errors) - any external tracker needs a file-mirror bridge or gate rework. Candidate
      families: self-hosted web trackers (Plane Docker Compose/K8s, OpenProject CE
      Rails, Redmine Rails, Gitea/Forgejo single-binary, Vikunja todo-semantics mismatch),
      MCP servers (Plane MCP official MIT 100+ tools/20 categories stdio uvx; OpenProject
      CE MCP jtauschl 14 stars 132 tools guarded writes context-frugal; mcp-redmine
      232 stars; Vikunja community 100 stars; Forgejo MCP 46-result ecosystem; GitHub
      MCP MIT but cloud/GHES-only local-first violation), local CLIs (git-bug GPLv3+
      git-object offline-first no MCP; taskwarrior single binary todo semantics), keep-local
      baseline (number allocator, template generator, README rollup updater, blocker-graph/frontier
      renderer, bats-tested) + official Filesystem MCP server as optional agent-facing
      layer. 3-constraint fit table (DIA-079 ASCII, gate compat, local-first WSL2/container).
      Top-3 ranking: keep-local baseline (native fit) > git-bug (mirror bridge needed)
      > OpenProject CE + jtauschl MCP (Tier-3 at scale). Preliminary keep-local recommendation
      (developer decides). Star counts for goern/raohwork Forgejo MCP, Plane MCP 286,
      GitHub MCP 32.2k, git-bug 10k, and the Gitea/Forgejo single-binary claim are
      researcher-supplied, not confirmed in archive, excluded per DIA-072 (section
      6). Cross-references res018 (DIA-125 first pass), ana006 (local-first decision),
      res008 (DIA-072 archival).'
    path: knowledge/res021-ticket-mgmt-automation/res021-ticket-mgmt-automation-conspect.md
    created: 2026-08-13
  - name: Evidence-Backed Decision Variants (DIA-115)
    description: 'Conspect for DIA-115 (research-first, OPEN): EBDV presentation format
      for policy-class decisions (10 archived sources, zero failures). Design: triggers
      (section-10 policy changes, AGENTS.md/prompt changes, agent-policy, model/tool-selection
      with >=2 candidates); per-variant field set (title, change-description, evidence-sources,
      pros/cons, effort, section-10-flag, Y-statement summary); evidence tiers T1 (committed/archived-conspec),
      T2 (web-fresh-cited URL+date), T3 ([INFERENCE] labeled, T3-alone insufficient);
      minimum >=2 real variants + recommendation + always-available abort/status-quo;
      chosen variant documented in ticket UPDATE block. Provenance: ADR/MADR/Y-statement
      (Zimmermann: neglected alternatives, empirical evidence over pseudo-rationale),
      InfoQ sustainable decisions, Claude Code show-evidence-not-assertion, Prisma
      alternatives-at-end, ruvnet decision log, Meshtastic rejected-markers; Swift/Carbon
      researcher-supplied not archived (DIA-072). Section-10 interaction: EBDV layers
      ON TOP, section 10 remains the routing gate, EBDV is a presentation requirement
      inside Phase 2 (Review & Decide) for policy-class only. Enforcement ranked
      cheap->heavy per DIA-086: (1) validate-decision-variants.sh mechanical validator
      in make test-config (mandatory), (2) OpenSpec template + Alternatives considered
      (mandatory), (3) AGENTS.md prompt rule (optional soft), (4) practice-protected
      + ai-auditor (deferred). Cross-refs res012-015 (evidence vocabulary) + ana015
      G1/G2/G3 + ana004 (mechanical beats prompt).'
    path: knowledge/res022-evidence-backed-decision-variants/res022-evidence-backed-decision-variants-conspect.md
    created: 2026-08-13
  - name: Dispatch Routing Registry Design (DIA-133)
    description: 'Conspect for DIA-133 (data-driven dispatch routing, opencode-config,
      OPEN): PARTIAL persistence per res-4 recommendation + developer KEEP decision
      2026-08-13 (binary per DIA-135) - registry schema + routing design + NEW Tier-2
      web-fresh quota-guard precedents NOT previously in the shelf (6 archived sources,
      zero failures, all Tier-1 trafilatura direct 2026-08-13). Registry design
      (Choice A1a): location knowledge/model-registry.yaml (evidence-co-located, ZERO
      read-scope change - orchestrator read block already allows knowledge/* at
      opencode.jsonc L172 read / L195 glob via DIA-126(a) expansion, verified 2026-08-13);
      per-model fields model_id, role, price_in_1m, price_out_1m, req_per_month,
      swe_bench_verified + source_ref, lane, fallback[], quota_notes, active. Model set:
      deepseek-v4-flash coder default $0.14/$0.28 158K req/mo, qwen3.7-plus arch/analyzer,
      kimi-k3 coder-escalated 490 req/mo binding cap SWE-V 93.40 Vals, gpt-5.6-luna
      analyzer-escalated subagent-weak, deepseek-v4-pro Rung-3 fallback (res017 REVERSAL
      of res015 MiMo pick - CAISI independent evidence), mimo-v2.5-pro fallback-2
      benchmark-gap-OPEN vendor-only, gpt-5.3-codex reviewer Copilot-credits req_per_month
      null. Routing: res014 Rung0-4 ladder codified (Rung0 coder/deepseek-v4-flash ->
      Rung1 retry -> Rung2 qwen3.7-plus -> Rung3 coder-escalated/kimi-k3 quota-guarded
      -> Rung4 reviewer/gpt-5.3-codex; analyzer qwen3.7-plus -> gpt-5.6-luna ->
      route-back). Quota-guard (Choice C1): procedural clone of COUNCIL-BUDGET-GUARD,
      count registry.jsonl event session_spawn per model filtered by YYYY-MM (registry.jsonl
      over messages.jsonl - plugin sole-writer + dispatch_state; ana007 anti-pattern),
      warn 80%, hard-stop count+1>cap -> fallback[] or wait_for_user, skip Copilot-credit
      lanes, check SILENT_FAILURE before re-dispatch (DIA-132 lesson). Tier-2 precedents:
      OhanaSec models+routingTable separation + benchScore-after-scored-run, Budibase
      monthly counter (dry-run-then-commit, percentage triggers 1-100, USAGE_LIMIT_EXCEEDED,
      getCurrentMonthString), Codex min_rate_limit_remaining_percent default 25,
      Alibaba proactive throttle (rate-limit headers, backoff cap+jitter, threshold
      wait-until-reset, idempotent reconcile), OmniRoute quota-aware strategies
      headroom/reset-window/reset-aware (freeMonthlyQuota/costPerQuery field names
