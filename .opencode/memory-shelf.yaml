      created: 2026-08-04
    - name: "GitHub Issues vs Local DIA Ledger — Architecture Decision"
      description: "Comparative analysis of GitHub Issues integration vs local DIA ledger. Verdict: local DIA ledger is architecturally correct (zero network dependency, zero auth surface, native evidence citations, simple plugin architecture). GitHub Issues would add 70-132h migration cost, broken evidence citations, network dependency, and auth complexity for zero user-visible benefit. Read-only export is the right move if web visibility is ever needed."
      path: "knowledge/ana006-issue-tracker-comparison/ana006-issue-tracker-comparison-report.md"
      created: 2026-08-06
    - name: "Silent Session Logging"
      description: "Analysis of orchestrator session-log pollution (m0001). Verdict: Option E (hybrid — plugin jsonl + derived md + log_decision tool) scores 10/10. Re-grounded 2026-08-06 against conspect res002 (10 MLA-cited sources). Plugin fs writes proven silent (registry.jsonl 634 rows, 0 pollution); dual-maintained messages.md + messages.jsonl is an anti-pattern (drift rows 1-131, double token cost, 1,170 visible edit tool calls per 585-row session). Dual-write DROPPED (row 589): no second writer ever runs; Phase 5 validates completeness via messages.jsonl ↔ registry.jsonl cross-check. Target: messages.jsonl canonical NDJSON, messages.md derived on-demand view, plugin sole writer, log_decision tool for semantic events, SQLite unchanged. 5-phase migration 44-68h; pollution reduction 100% → 1%; Phases 1/3/4 require §10 routing. Option D (SQLite-only) rejected 3/10."
      path: "knowledge/ana007-session-log-silencing/ana007-session-log-silencing-report.md"
      created: 2026-08-06
    - name: "P5 jsonl-Cross-Check Readiness"
      description: "Analysis of why the P5 registry↔messages cross-check gate computed 3.35% on the 2026-08-06 corpus. Root cause: the universe was ALL registry task_success rows (209), of which 202 (96.7%) are pre-plugin legacy rows (seq 1-682, 08-04/05) written before the messages.jsonl plugin writer existed — structurally unmatchable (no gen_ai.agent.id in their messages rows). Plugin itself healthy (7/7 smoke = 100%). Owner-verified correction: writer==plugin filter is a NO-OP (all 704 registry rows already carry writer:plugin); the only reliable discriminator is TIMESTAMP. Owner-approved fix: timestamp filter with --since default 2026-08-06T19:30:00Z (plugin messages-writer activation; first plugin row 19:30:20.746Z) + report-split diagnostic (legacy vs in-universe counts). Verified in implementing lane: real-data gate 8/8 = 100% PASS."
      path: "knowledge/ana008-crosscheck-readiness/ana008-crosscheck-readiness-report.md"
      created: 2026-08-06
    - name: "DIA-067 Container Strategy Analysis: trafilatura Availability"
      description: "Multi-criteria decision analysis of 6 container strategies (bake into image, venv per run, uv tool install, dedicated tool container, mise Python, apt package) for trafilatura availability in the dev container. Decision: Option C (uv tool install) recommended — highest weighted score 9.0/10, zero per-run latency, deterministic version pinning via TRAFILATURA_VERSION ARG, no --break-system-packages needed, aligns with all 5 established patterns (build-time provisioning, uv for Python tooling, PEP668 handling, one-container architecture, test-infra gates). Option A (bake into dev image, 8.7/10) is the fallback. Ticket: DIA-067."
      path: "knowledge/ana001-docker-trafilatura-strategy/ana001-docker-trafilatura-strategy-report.md"
      created: 2026-08-08
    - name: "Telemetry Re-Entrancy Audit"
      description: "Root-cause audit of opencode-telemetry@0.1.19 and opencode-token-monitor@0.5.0 for recursive telemetry and re-entrancy failure modes. Finds no active infinite loops but identifies P1-P4 guard gaps: telemetry lacks P1/P2/P3 (has P4 message dedup but loses state on restart); token-monitor lacks P2/P3/P4 (has P1 session-level in-flight guard but no message dedup); both lack P2 context suppression. opencode-subagent-output not loaded at runtime. Recommendations: (1) add P2 context suppression to both plugins, (2) persist telemetry's seenMessageIds to survive restarts, (3) add message dedup to token-monitor, (4) isolate telemetry I/O in separate process, (5) fix telemetry's registerCommands path portability (DIA-068). Mermaid systems map and P1-P4 classification table included."
      path: "knowledge/ana009-telemetry-reentrancy-audit/ana009-telemetry-reentrancy-audit-report.md"
      created: 2026-08-08
