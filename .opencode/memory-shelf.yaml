  - name: dev-infra-pin-sync
    description: "OpenSpec change: enforces the volta-to-mise \xA72.1 contract \u2014\
      \ .mise.toml \u2194 Dockerfile pin parity for node/pnpm across BOTH Dockerfiles\
      \ (Dockerfile.dev + tools/opencode-docker/Dockerfile; 4 comparisons total: 2\
      \ pins \xD7 2 Dockerfiles). New standalone scripts/check-pin-sync.sh (~70-90L,\
      \ bash-3 compatible, 4 functions: parse_reference/parse_dockerfile(file,label)/compare/aggregate;\
      \ grep/awk-based parsing, no TOML library; parse_dockerfile invoked per source\
      \ with label, results saved to per-source var pairs DOCKER_DEV_NODE/DOCKER_DEV_PNPM\
      \ + DOCKER_OC_NODE/DOCKER_OC_PNPM; last-wins ARG semantics with duplicate-detection\
      \ short-circuit; quote/CRLF/whitespace stripping; exit precedence 2>1>0 (INFRA>mismatch>match);\
      \ report-ALL, not fail-fast; output contract: ok\u2192stdout, fail\u2192stderr,\
      \ summary on both; ok/fail lines carry the source label; MISE_VERSION parity\
      \ out of scope \u2014 OC Dockerfile is read-only). 13-scenario bats suite T1-T13\
      \ (match across both Dockerfiles / single-mismatch in either Dockerfile / multi-mismatch\
      \ report-ALL / missing source \xD73: .mise.toml + Dockerfile.dev + tools/opencode-docker/Dockerfile\
      \ / duplicate key \xD73: [tools] + Dockerfile.dev ARG + OC Dockerfile ARG /\
      \ quote-variations / CRLF / whitespace-variations) + S4 real-.mise.toml structural\
      \ assertion. Shared fixture helpers (install_fakes/setup_tree pattern from check-tools.bats)\
      \ promoted to test-helper.bash; setup_pin_sync_tree extended to 9-param signature\
      \ (3 flags + 6 pins) planting all three source fixtures incl. tools/opencode-docker/Dockerfile.\
      \ Makefile wiring: new check-pin-sync target + test-shell prereq chain (validator\
      \ runs before any bats, fails fast on pin drift) + bats-wrapper.sh bash -n allowlist.\
