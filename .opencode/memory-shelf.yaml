      description: "Audit of whether the 'interview-first / grill-the-developer' spec authoring philosophy is durably embedded in OpenCode/OMO/OpenSpec config. Verdict: 52/100 — embedded as intent, not enforcement. 4 hard bypass paths (/opsx-propose, /opsx-new, /tdd-cycle, skills:['*']) outrank 4 soft ALIGNED layers (boss_append, @openspec-plan, practice-protected, AGENTS.md §2). Root cause: philosophy lives in prompt append + convention while hard paths bypass it; the boss.ts fork patch was written but never built. 3-phase remediation plan: Phase 1 kill one-shot defaults (~2h, score →75), Phase 2 structural gate via fork/build, Phase 3 port AIHero grill protocol into @openspec-plan."
