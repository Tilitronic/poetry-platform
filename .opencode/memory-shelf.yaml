      loops but identifies P1-P4 guard gaps: telemetry lacks P1/P2/P3 (has P4 message
      dedup but loses state on restart); token-monitor lacks P2/P3/P4 (has P1 session-level
      in-flight guard but no message dedup); both lack P2 context suppression. opencode-subagent-output
      not loaded at runtime. Recommendations: (1) add P2 context suppression to both
      plugins, (2) persist telemetry''s seenMessageIds to survive restarts, (3) add
      message dedup to token-monitor, (4) isolate telemetry I/O in separate process,
      (5) fix telemetry''s registerCommands path portability (DIA-068). Mermaid systems
