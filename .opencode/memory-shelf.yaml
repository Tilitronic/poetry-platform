    - name: "volta-to-mise"
      description: "OpenSpec change: replace the unmaintained Volta JS tool manager with the SHA256-verifiable mise tool manager in the dev container. Closes DIA-030 (CLOSED 2026-08-03 with owner migration directive — Volta is officially unmaintained per issue #2080, v2.0.2 2024-12-05 stale, upstream recommends mise, no checksums ever coming). Dual-path contract: mise tarball installs (SHA256-verified in Dockerfile.dev + tools/opencode-docker/Dockerfile) + .mise.toml declares (repo root, [tools] only, no env/plugins/settings — interview Q8). MISE_VERSION ARG + SHA256 resolved at implementation time via flag (b) fetch command (TODO — spec does not invent hashes). MISE_TRUSTED_CONFIG_PATHS=/workspace ENV so non-root dev user reads mounted .mise.toml. Seams S1 Dockerfile install block, S2 make check-tools + bats, S3 smoke-test runtime probes, S4 .mise.toml integrity. Removes both volta blocks (Dockerfile.dev lines 108-118 + tools/opencode-docker/Dockerfile lines 48-54) + both package.json volta blocks (root + apps/author-studio). Renames volta* → mise in collect-runtime-deps.sh whitelist. Adds make check-tools (host-runnable, NOT wired into test-shell/test-infra — requires mise on PATH). Adds 3 smoke probes (mise --version, mise install+mise which node, MISE_TRUSTED_CONFIG_PATHS set). 5 vertical slices: T1 .mise.toml+volta-removals+check-tools+bats (foundation), T2 Dockerfile.dev+S2 ENV+smoke probes (depends T1), T3 tools/opencode-docker Dockerfile swap+whitelist rename (depends T2 — copies FLAG_B pattern), T4 docs updates (depends T1, parallel with T2/T3), T5 full validation gate (depends T2/T3/T4). Rollback: git revert + make build && make test-infra. AC1-AC14 testable at seams. No .sdd/ module doc created (dev-infra within existing boundaries, no @architector dispatch)."
      path: "openspec/changes/volta-to-mise/"
      created: 2026-08-03
      status: proposed
    - name: "ai-self-improvement-auditor-and-cleanup"
      description: "OpenSpec change (4-phase self-improvement campaign, §10 gate ai--1 2026-08-05/06): skill shadowing cleanup — delete 5 byte-exact duplicate skills from .opencode/skills/ (book-rag, mermaid-diagramming, console-charting, debugging-workflow, teaching); keep playwright-browser (4-line intentional diff → SOFT warn) and git-diff (project version better). validate-skills.sh (.opencode/scripts/, 296L, exit 0/1/2, wired via make test-skills) gains two-tier duplicate detection (byte-exact = hard error, near-dupe = SOFT warn). Registers @ai-auditor via 4-source containment contract (S1 AGENTS.md §9 row + S2 opencode.jsonc read-only block + S3 OMO agents+3 presets + S4 .opencode/agents/ai-auditor.md; frontmatter mirrors memory-manager.md — permissions live in opencode.jsonc; models github-copilot/gpt-5.3-codex primary, github-copilot/gemini-3.1-pro-preview fallback). Narrows @ai-specialist. Adds NEXT-RUN.md §2 COUNCIL-BUDGET-GUARD: council only at C1–C5 crisis, Copilot-credit 75% warn 1125 / 90% hard-stop 1350 of 1500. Gate rulings folded in: D1 CLASH dropped (issue #197 monitored), D5 dcp.jsonc is compaction-limits only (no skill alignment), D6 openspec-plan skip-mode already implemented (OMO line 531 — no model swap)."
      path: "openspec/changes/ai-self-improvement-auditor-and-cleanup/"
      created: 2026-08-06
      status: implemented
    - name: "dev-infra-pin-sync"
      description: "OpenSpec change: enforces the volta-to-mise §2.1 contract — .mise.toml ↔ Dockerfile pin parity for node/pnpm across BOTH Dockerfiles (Dockerfile.dev + tools/opencode-docker/Dockerfile; 4 comparisons total: 2 pins × 2 Dockerfiles). New standalone scripts/check-pin-sync.sh (~70-90L, bash-3 compatible, 4 functions: parse_reference/parse_dockerfile(file,label)/compare/aggregate; grep/awk-based parsing, no TOML library; parse_dockerfile invoked per source with label, results saved to per-source var pairs DOCKER_DEV_NODE/DOCKER_DEV_PNPM + DOCKER_OC_NODE/DOCKER_OC_PNPM; last-wins ARG semantics with duplicate-detection short-circuit; quote/CRLF/whitespace stripping; exit precedence 2>1>0 (INFRA>mismatch>match); report-ALL, not fail-fast; output contract: ok→stdout, fail→stderr, summary on both; ok/fail lines carry the source label; MISE_VERSION parity out of scope — OC Dockerfile is read-only). 13-scenario bats suite T1-T13 (match across both Dockerfiles / single-mismatch in either Dockerfile / multi-mismatch report-ALL / missing source ×3: .mise.toml + Dockerfile.dev + tools/opencode-docker/Dockerfile / duplicate key ×3: [tools] + Dockerfile.dev ARG + OC Dockerfile ARG / quote-variations / CRLF / whitespace-variations) + S4 real-.mise.toml structural assertion. Shared fixture helpers (install_fakes/setup_tree pattern from check-tools.bats) promoted to test-helper.bash; setup_pin_sync_tree extended to 9-param signature (3 flags + 6 pins) planting all three source fixtures incl. tools/opencode-docker/Dockerfile. Makefile wiring: new check-pin-sync target + test-shell prereq chain (validator runs before any bats, fails fast on pin drift) + bats-wrapper.sh bash -n allowlist. Closes DIA-050 (OPEN since 2026-08-05, tracked the .mise.toml ↔ Dockerfile parity gap from DIA-045 F15). 3 vertical slices: T1 core script, T2 bats suite + helper promotion, T3 Makefile wiring + DIA-050 close. No .sdd/ document (dev-infra within existing module boundaries — .sdd/ layer has only README.md today). No §10 routing (pure dev-infra artifact, not AI-tooling config). Rollback: file deletion / git checkout; no .mise.toml or Dockerfile edits."
      path: "openspec/changes/dev-infra-pin-sync/"
      created: 2026-08-07
      status: implemented
    - name: "dia-066-tool-coverage-audit"
      description: "OpenSpec change: hybrid tool-coverage auditor script that surfaces unlisted default-allow tools in OpenCode permission configs. Enumeration strategy: one `opencode debug agent <canonical-agent>` runtime invocation (first alphabetical agent) for the complete tool universe (built-ins + plugin-registered + MCP) + static JSONC parse of each agent's permission block. Cross-reference computes effective coverage (global ∪ per-agent merge) and reports gaps = (tool universe − effective coverage) where default disposition is allow. Exit-code contract: 0 (no HARD gaps) / 1 (HARD gap found OR malformed JSONC) / 2 (INFRA: no opencode, no python3, no default model, v2 schema detected, missing config file). Output contract: FAIL:/WARN: to stderr, ok: to stdout, final summary `N agents audited, M gaps, K warnings` to stdout. Blanket-form detection as first-class WARN category (does not attempt per-tool enumeration against blanket). v1 schema assertion; snip v2 rejection (exit 2). Default-ask/deny tools as SOFT findings (hint column, no exit-code flip). Hermetic bats tests via AUDIT_TOOL_CENSUS_FILE env override (pre-recorded JSON file — tests do NOT require live opencode install). Makefile wiring: test-config invokes auditor for both .opencode/opencode.jsonc and tools/opencode-docker/config/opencode.json (separate passes). Script path: scripts/audit-agent-tool-coverage.sh. Test path: scripts/__tests__/audit-agent-tool-coverage.bats. skip_specs: true (dev-infra within existing boundaries, no spec-level behavior changes). Source ticket: DIA-066 (tool-coverage audit script — surface unlisted default-allow tools). 6 vertical slices: T1 script skeleton + argument parsing + exit-code contract, T2 static JSONC parse (agents + permission blocks), T3 runtime census integration (AUDIT_TOOL_CENSUS_FILE seam), T4 cross-reference logic + output formatting + gap detection, T5 blanket-form detection + v2 schema detection, T6 Makefile wiring + integration test. No .sdd/ document (dev-infra within existing module boundaries — .sdd/ layer does not govern scripts/ surface)."
      path: "openspec/changes/dia-066-tool-coverage-audit/"
      created: 2026-08-08
      status: proposed
