  - name: P5 jsonl-Cross-Check Readiness
    description: "Analysis of why the P5 registry\u2194messages cross-check gate computed\
      \ 3.35% on the 2026-08-06 corpus. Root cause: the universe was ALL registry\
      \ task_success rows (209), of which 202 (96.7%) are pre-plugin legacy rows (seq\
      \ 1-682, 08-04/05) written before the messages.jsonl plugin writer existed \u2014\
      \ structurally unmatchable (no gen_ai.agent.id in their messages rows). Plugin\
      \ itself healthy (7/7 smoke = 100%). Owner-verified correction: writer==plugin\
      \ filter is a NO-OP (all 704 registry rows already carry writer:plugin); the\
      \ only reliable discriminator is TIMESTAMP. Owner-approved fix: timestamp filter\
      \ with --since default 2026-08-06T19:30:00Z (plugin messages-writer activation;\
      \ first plugin row 19:30:20.746Z) + report-split diagnostic (legacy vs in-universe\
      \ counts). Verified in implementing lane: real-data gate 8/8 = 100% PASS."
    path: knowledge/ana008-crosscheck-readiness/ana008-crosscheck-readiness-report.md
    created: 2026-08-06
  - name: 'DIA-067 Container Strategy Analysis: trafilatura Availability'
    description: "Multi-criteria decision analysis of 6 container strategies (bake\
      \ into image, venv per run, uv tool install, dedicated tool container, mise\
      \ Python, apt package) for trafilatura availability in the dev container. Decision:\
      \ Option C (uv tool install) recommended \u2014 highest weighted score 9.0/10,\
      \ zero per-run latency, deterministic version pinning via TRAFILATURA_VERSION\
      \ ARG, no --break-system-packages needed, aligns with all 5 established patterns\
      \ (build-time provisioning, uv for Python tooling, PEP668 handling, one-container\
      \ architecture, test-infra gates). Option A (bake into dev image, 8.7/10) is\
      \ the fallback. Ticket: DIA-067."
