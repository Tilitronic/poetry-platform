  - name: res020-ssh-add-confirmation
    description: 'OpenSSH ssh-add -c confirmation-per-use on Fedora 44 + KDE Plasma + systemd user ssh-agent (socket-activated, /run/user/1000/ssh-agent.socket) with the agent socket forwarded into opencode-docker (DIA-173). Key facts: -c = per-operation host-side confirm via ssh-askpass (each git push = one host GUI prompt); SSH_ASKPASS + SSH_ASKPASS_REQUIRE=force must be in the AGENT OWN systemd Drop-in (~/.config/systemd/user/ssh-agent.service.d/override.conf) - the agent reads them from its own env at prompt time, no file fallback; KDE Wayland gotcha: ksshaskpass needs QT_QPA_PLATFORM=wayland + WAYLAND_DISPLAY=wayland-0 (else qt.qpa.xcb could not connect to display :0); ksshaskpass is a SEPARATE package (6.7.4-1.fc44) not default on KDE; ssh-add -l does NOT show confirm-on (no simple CLI check); agent restart clears keys + confirm flags (Drop-in first, then ssh-add -c); no container-side change needed for DIA-173 (confirm state is host-agent); recommended combo ssh-add -c -t 8h; YubiKey: hardware touch OR -c, not both.'
