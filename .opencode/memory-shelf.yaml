  - name: "DIA-098 Session Stop-Point Correlation and Stall-Detection Design"
    description: "Read-only session-evidence analysis (3324 registry rows, 2867 message rows, 1108 unique sessions, 2026-08-04..13). 8 stop-point classes enumerated (SP1-SP8): normal completion (996), crash/cancellation (17), false-positive failed from multi-idle (3), silent failure alert (30), gate-blocked (30), true orphan (2), recovered fail (12), auxiliary-only (69). 7 failure-class taxonomy (F1-F7): permission-ask stall, silent-empty result, tool-error loop, gate-blocked, crash/cancellation, orphaned/dangling, normal completion. Key findings: F1 error field is [object Object] for all 51 session_failed (uninformative, plugin bug); F2 48.8% of failed sessions are false positives from multi-idle anomaly; F3 permission stalls are invisible in registry (tracked only in ticker.json). Stall-detection signal design: primary signal (b) in-flight dangling row with periodic sweep every 60s, threshold 10min subagent / 20min orchestrator; fallback signal (c) permission-ask timeout 5min via needs-input-observer ENTER/CLEAR + POST /session/:id/permissions/:id auto-reject. Complete-vs-interrupted classifier pseudocode with validation (1003/1108 sessions classified, 90.5% coverage). Auto-resume design: NO automatic resume recommended (fail-fast + re-route instead), exception is permission-stall auto-reject. 6 prioritized recommendations (R1-R6), 5 of 6 require section-10 routing (plugin edits). Integration points: needs-input-observer (permission hooks), delegation-observer (registry writer + checkSilentFailures). Cross-references DIA-099, DIA-126(b), ana011, ana015, DIA-130, dia-redispatch-cycle."
