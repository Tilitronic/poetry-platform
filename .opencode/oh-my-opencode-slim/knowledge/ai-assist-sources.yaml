# Model selection rules of thumb (pricing always fetched fresh from web)
model_selection_guidelines:
  role_mapping:
    orchestrator: "DS V4 Flash (Go) — fast routing, 1M ctx, cheap"
    architector: "Gemini 3.1 Pro (Copilot) — highest GPQA for architecture depth"
    coder: "DS V4 Flash (Go) — speed + value for implementation"
    reviewer: "Qwen3.7 Plus (Go) — review diversity vs coder (DeepSeek), 77.7% SWE"
    openspec_plan: "Qwen3.7 Plus (Go) — volume for spec writing"
    designer: "Kimi K2.7 Code (Go) or Claude Sonnet 4.5 (Copilot) — fast, multimodal"
    code_navigator: "DS V4 Flash (Go) — fast code search, cheap"
    researcher: "DS V4 Flash (Go) — volume research"
    conspecter: "DS V4 Flash (Go) — volume synthesis"
    analyzer: "Qwen3.7 Plus (Go) — 90.3% GPQA for analysis"
    observer: "Kimi K2.7 Code (Go) — multimodal primary; Copilot fallback: GPT-5 mini; tail: big-pickle"
    ai-specialist: "Qwen3.7 Plus (Go) — research agent"
    resource-manager: "DS V4 Flash (Go) — fast curation of sources.yaml, Tier-1 caching, cheap"

  rules:
    - "Always check current pricing from web before recommending — Go and Copilot rates change"
    - "Default to Go models for volume work (DS V4 Flash, Qwen3.7 Plus)"
    - "Copilot credits: 1,500/mo for Pro, 7,000/mo for Pro+ — reserve for model diversity"
    - "Never recommend a model the user doesn't have access to"
    - "For review diversity: reviewer must be different model family than coder"
    - "Qwen3.7 Max is special ammo — not a default for any agent (6x cost for 2% gain)"
    - "Kimi K3 (490 req/mo), Grok 4.5 (600 req/mo), Qwen3.8 Max (810 req/mo) are special-ammo premium Go models with tight caps — reserve for high-difficulty, not defaults"

community_source_evaluation:
  awesome_opencode:
    url: "https://github.com/awesome-opencode/awesome-opencode"
    evaluation_rules:
      - "Star count is the PRIMARY quality signal. More stars = more community validation, battle-testing, and ongoing maintenance."
      - "TOOLS WITH < 100 STARS: Treat as experimental. Only recommend if they solve a specific gap nothing else covers. Flag the low adoption risk."
      - "TOOLS WITH 100-500 STARS: Reasonable adoption. Note the star count and any recent commit activity in your recommendation."
      - "TOOLS WITH 500+ STARS: Well-established. Can recommend more confidently, but still verify last update date."
      - "TOOLS WITH 5000+ STARS: Industry standard. High confidence."
      - "ALWAYS check the 'last commit' / 'last release' date. A tool with high stars but no commits in 6+ months is abandoned — flag this."
      - "Cross-reference recommendations with official OpenCode documentation. Community tools may lag behind API changes."
      - "Do NOT recommend unmaintained tools even if they have high stars — security risk and compatibility issues."
