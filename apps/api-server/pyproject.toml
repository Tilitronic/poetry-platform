[project]
name = "poetry-api-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
]

# Dev-only test tooling: `uv pip install -e ".[dev]"` (or pip). pytest-asyncio
# is required for the asyncio_mode = "auto" option below. ruff is the Python
# linter/formatter wired into lint-staged (pre-commit) and verify-python.sh
# (pre-push) — it runs from the project-local venv, never from host python.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.0",
]

# D3: line-length 100 = prettier printWidth parity across the monorepo.
# D4: select E+F+I (pyflakes + pycodestyle errors + isort). UP is deliberately
# excluded — its modernization churns existing code without adding safety.
# E4: exclude list mirrors .prettierignore for the Python tooling.
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".git",
    "node_modules",
    ".opencode",
    "secrets",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
# Kept: first async test will land in app.core.auth
asyncio_mode = "auto"
testpaths = ["tests"]
